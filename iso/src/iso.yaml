# enforcing=0 = SELinux permissive in the LIVE/INSTALLER session only: its root filesystem comes from a
# container image without SELinux labels and would not boot enforcing (same as Universal Blue's Titanoboa
# example). The INSTALLED system boots enforcing. To do: label the live rootfs, then drop enforcing=0.
label: FENNEK-OS
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "Try or install Fennek OS"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=FENNEK-OS enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try or install Fennek OS (basic graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=FENNEK-OS enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
