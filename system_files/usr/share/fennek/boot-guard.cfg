# Fennek OS boot guard (/usr/libexec/fennek-boot-guard): a new version gets two tries to start. After that the previous
# version starts instead (the second entry in the menu), and Fennek OS makes that the default again.
if [ -n "${fennek_tries}" ]; then
  if [ "${fennek_tries}" = "2" ]; then
    set fennek_tries=1
  elif [ "${fennek_tries}" = "1" ]; then
    set fennek_tries=0
  else
    set default=1
    set fennek_fell_back=1
    save_env fennek_fell_back
  fi
  save_env fennek_tries
fi
