# Fennek OS battery settings.
# Write cached data to disk every 15 s instead of 5 s, so the disk can stay asleep longer. Programs that save
# properly (fsync) are unaffected; after a sudden power loss at most the last 15 s of other writes are lost.
vm.dirty_writeback_centisecs = 1500
# Same as the nmi_watchdog=0 kernel option (also applies when booted without it).
kernel.nmi_watchdog = 0
