# Fennek OS: the manual page index was rebuilt at every start, and the desktop waited for it (about 10 s). Now it runs
# beside the start-up instead of before the desktop, and only when the system is a new build.
[Unit]
# Without the default dependencies, multi-user.target no longer orders itself after this service.
DefaultDependencies=no
After=basic.target local-fs.target
Conflicts=shutdown.target
Before=shutdown.target

[Service]
ExecCondition=/bin/sh -c '! cmp -s /usr/lib/os-release /var/cache/man/fennek-indexed-build'
ExecStartPost=/bin/cp /usr/lib/os-release /var/cache/man/fennek-indexed-build
