name: Feature request
description: An idea that would make Fennek OS better for people who want a familiar, classic desktop
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or annoyance, not the solution. How are you used to doing it on other systems?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: false
