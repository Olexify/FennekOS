name: retry

# A failed nightly build gets one more try the same day (a stalled mirror or a registry hiccup shouldn't cost a night's
# security updates). Only the failed editions run again; a real break fails twice and opens an issue, which closes by
# itself when a later nightly of that workflow works.
on:
  workflow_run:
    workflows: [build, build-arm]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - run: gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}

  alert:
    if: github.event.workflow_run.event == 'schedule' && (github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt > 1))
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    concurrency: nightly-alert   # build and build-arm can finish together: still one issue
    steps:
      # The issue has one "- workflow: link" line per failing workflow and closes when the last of them works again.
      - run: |
          issue=$(gh issue list --state open --limit 1000 --json number,title --jq 'map(select(.title == "Nightly build failing"))[0].number // empty')
          body=$([ -z "$issue" ] || gh issue view "$issue" --json body --jq .body)
          line="- $WORKFLOW: $RUN_URL"
          if [ "$CONCLUSION" = failure ]; then
            if [ -z "$issue" ]; then
              gh issue create --title "Nightly build failing" --body "A nightly build failed, and failed again after its automatic retry, so last night's updates and security fixes may not have been published. The link below shows what went wrong. This issue closes by itself when a later nightly run of that workflow works."$'\n\n'"$line"
            elif ! grep -q "^- $WORKFLOW: " <<<"$body"; then
              gh issue edit "$issue" --body "$body"$'\n'"$line"
            fi
          elif grep -q "^- $WORKFLOW: " <<<"$body"; then
            rest=$(grep -v "^- $WORKFLOW: " <<<"$body" || true)
            if grep -q '^- [^ ]*: http' <<<"$rest"; then
              gh issue edit "$issue" --body "$rest"
            else
              gh issue close "$issue" --comment "The nightly $WORKFLOW run works again: $RUN_URL"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
