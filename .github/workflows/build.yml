name: build

on:
  push:
    branches: [main]
  pull_request:
  # Daily: picks up Fedora / Universal Blue security fixes even when nothing changed here.
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # publish to ghcr.io (only used outside pull requests)
    env:
      IMAGE: ghcr.io/olexify/fennekos
    steps:
      # Actions pinned to commits (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # The base is ~11 GB; the default runner has too little free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /

      - name: Verify base image signature and pin its digest
        run: echo "BASE_IMAGE=$(bash verify-base.sh)" >> "$GITHUB_ENV"

      # podman, not docker: the base has ~256 layers, docker's overlay limit is ~127.
      - name: Build image
        run: sudo podman build --build-arg "BASE_IMAGE=$BASE_IMAGE" -f Containerfile -t fennek:ci .

      - name: Test image
        run: sudo podman run --rm -v "$PWD/test.sh:/t.sh:ro,z" fennek:ci bash /t.sh

      # Publishing + signing never runs for pull requests (a stranger's PR must not publish or sign).
      - name: Publish and sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          day=$(date -u +%Y%m%d)
          for tag in latest "$day"; do
            sudo podman push --digestfile "/tmp/digest-$tag" fennek:ci "$IMAGE:$tag"
            # Classic signature format: what installed systems (containers/image sigstore attachments) can read.
            # cosign v3 defaults to the new bundle format, which they reject ("no signature exists").
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false \
              "$IMAGE@$(cat "/tmp/digest-$tag")"
          done
          # Prove what users will check: the published image verifies with the public key in the repo,
          # and the way installed systems verify it (containers policy + sigstore attachments) accepts it.
          cosign verify --key keys/fennek-cosign.pub "$IMAGE:latest" > /dev/null
          mkdir -p /tmp/client/registries.d
          printf 'docker:\n  ghcr.io/olexify/fennekos:\n    use-sigstore-attachments: true\n' > /tmp/client/registries.d/fennek.yaml
          printf '{"default":[{"type":"reject"}],"transports":{"docker":{"ghcr.io/olexify/fennekos":[{"type":"sigstoreSigned","keyPath":"%s","signedIdentity":{"type":"matchRepository"}}]}}}' \
            "$PWD/keys/fennek-cosign.pub" > /tmp/client/policy.json
          sudo skopeo copy --policy /tmp/client/policy.json --registries.d /tmp/client/registries.d \
            "docker://$IMAGE@$(cat /tmp/digest-latest)" "oci:/mnt/client-check:latest" > /dev/null
          sudo rm -rf /mnt/client-check
          echo "Published $IMAGE:latest and :$day ($(cat /tmp/digest-latest)), signed and verified."
