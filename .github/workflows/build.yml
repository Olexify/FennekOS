name: build

# Not on every push: small changes are batched. Builds run nightly (base security fixes + the day's work)
# and on demand (Actions > build > Run workflow). Pull requests are built and tested, never published.
on:
  pull_request:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Two editions from the same source: the main one, and one for NVIDIA graphics (Universal Blue's kinoite-nvidia
    # base, with NVIDIA's open kernel driver: needed by RTX 50 cards, good for RTX 20+).
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: ""
            base: kinoite-main
            image: fennekos
          - edition: nvidia
            base: kinoite-nvidia
            image: fennekos-nvidia
    permissions:
      contents: read
      packages: write   # publish to ghcr.io (only used outside pull requests)
    env:
      IMAGE: ghcr.io/olexify/${{ matrix.image }}
      FENNEK_EDITION: ${{ matrix.edition }}
    steps:
      # Actions pinned to commits (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # The base is ~11 GB; the default runner has too little free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          # Build + regrouping need ~40 GB: container storage on the runner's big /mnt disk.
          sudo mkdir -p /mnt/containers && sudo rm -rf /var/lib/containers && sudo ln -s /mnt/containers /var/lib/containers
          df -h / /mnt

      - name: Verify base image signature and pin its digest
        run: echo "BASE_IMAGE=$(bash verify-base.sh ghcr.io/ublue-os/${{ matrix.base }}:44)" >> "$GITHUB_ENV"

      # podman, not docker: the base has ~256 layers, docker's overlay limit is ~127.
      - name: Build image
        run: |
          # Version from the milestones file (1.0.12) + immutable build id (date.commit): Trails in the Updates window.
          v=$(python3 tools/fennek-version.py)
          b="$(date -u +%Y.%m.%d).${GITHUB_SHA::7}"
          echo "Fennek OS $v (build $b)"
          sudo podman build --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "FENNEK_VERSION=$v" --build-arg "FENNEK_BUILD=$b" --build-arg "FENNEK_EDITION=$FENNEK_EDITION"             -f Containerfile -t fennek:ci .

      - name: Test image
        run: sudo podman run --rm -e FENNEK_EDITION -v "$PWD/test.sh:/t.sh:ro,z" fennek:ci bash /t.sh

      # Content-based layers: daily updates only download what changed (see chunk/Containerfile).
      - name: Regroup layers (chunkah, signature-verified)
        run: |
          out=$(cosign verify quay.io/coreos/chunkah:v0.7.1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/coreos/chunkah/.github/workflows/ci.yml@refs/tags/v0.7.1')
          # ^ exactly their release workflow for this tag (not any branch/workflow of the repo)
          chunkah="quay.io/coreos/chunkah@$(jq -r '.[0].critical.image."docker-manifest-digest"' <<<"$out")"
          [[ $chunkah == *@sha256:* ]]
          # Ubuntu's podman bundles buildah < 1.44: chunkah's output dir must be mounted explicitly, and
          # "FROM oci:out" resolves against the working directory, so build from inside chunk/.
          cd chunk
          sudo podman build --skip-unused-stages=false --from fennek:ci \
            -v "$PWD:/run/src" --security-opt=label=disable \
            --build-arg "CHUNKAH=$chunkah" \
            --build-arg "CHUNKAH_CONFIG_STR=$(sudo podman inspect fennek:ci)" \
            --build-arg "CHUNKAH_ARGS=--prune /sysroot/ --max-layers 128 --label ostree.commit- --label ostree.final-diffid-" \
            -f Containerfile -t fennek:chunked .
          sudo podman image inspect fennek:chunked --format '{{len .RootFS.Layers}} layers, bootc={{index .Labels "containers.bootc"}}'

      - name: Test regrouped image
        run: |
          sudo podman run --rm fennek:chunked bootc container lint
          sudo podman run --rm -e FENNEK_EDITION -v "$PWD/test.sh:/t.sh:ro,z" fennek:chunked bash /t.sh
          sudo podman tag fennek:chunked fennek:publish

      # Publishing + signing never runs for pull requests (a stranger's PR must not publish or sign).
      - name: Publish and sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          day=$(date -u +%Y%m%d)
          for tag in latest "$day"; do
            sudo podman push --digestfile "/tmp/digest-$tag" fennek:publish "$IMAGE:$tag"
            # Classic signature format: what installed systems (containers/image sigstore attachments) can read.
            # cosign v3 defaults to the new bundle format, which they reject ("no signature exists").
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false \
              "$IMAGE@$(cat "/tmp/digest-$tag")"
          done
          # Prove what users will check: the published image verifies with the public key in the repo,
          # and the way installed systems verify it (containers policy + sigstore attachments) accepts it.
          cosign verify --key keys/fennek-cosign.pub "$IMAGE:latest" > /dev/null
          mkdir -p /tmp/client/registries.d
          printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "$IMAGE" > /tmp/client/registries.d/fennek.yaml
          printf '{"default":[{"type":"reject"}],"transports":{"docker":{"%s":[{"type":"sigstoreSigned","keyPath":"%s","signedIdentity":{"type":"matchRepository"}}]}}}' \
            "$IMAGE" "$PWD/keys/fennek-cosign.pub" > /tmp/client/policy.json
          # Verification happens while reading the source; the local oci: copy just can't store signatures.
          sudo skopeo copy --remove-signatures --policy /tmp/client/policy.json --registries.d /tmp/client/registries.d \
            "docker://$IMAGE@$(cat /tmp/digest-latest)" "oci:/mnt/client-check:latest" > /dev/null
          sudo rm -rf /mnt/client-check
          echo "Published $IMAGE:latest and :$day ($(cat /tmp/digest-latest)), signed and verified."
