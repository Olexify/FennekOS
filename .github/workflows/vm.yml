name: vm

# The real-VM test on an already published image: on demand, and every Sunday (after that day's nightly) with the rollback
# test on the standard image. Nightly builds run the same test before publishing.
on:
  schedule:
    - cron: "23 14 * * 0"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name"
        default: fennekos
      tag:
        description: "Image tag"
        default: latest
      edition:
        description: "Expected edition (empty or nvidia)"
        default: ""
      rollback:
        description: "Also test that a bad update undoes itself (adds ~20 minutes)"
        type: boolean
        default: false
      mok:
        description: "Also test the Secure Boot key step (needs image fennekos-nvidia and edition nvidia, adds ~5 minutes)"
        type: boolean
        default: false
      wizard:
        description: "Only a picture of the first-run wizard (wizard-1.png): no account, no other checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-24.04
    # ~10 minutes plus what's asked for. The rollback test gives itself up to 40: it stops with its own message before this.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Disk space and tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo mkdir -p /mnt/containers && sudo rm -rf /var/lib/containers && sudo ln -s /mnt/containers /var/lib/containers
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf ntfs-3g gdisk

      - name: Test in a VM
        env:
          # On schedule there are no inputs: the published standard image, with the rollback test.
          IMAGE: ghcr.io/olexify/${{ inputs.image || 'fennekos' }}:${{ inputs.tag || 'latest' }}
          EDITION: ${{ inputs.edition || '' }}
          FENNEK_VM_ROLLBACK: ${{ (inputs.rollback || github.event_name == 'schedule') && '1' || '' }}
          FENNEK_VM_MOK: ${{ inputs.mok && '1' || '' }}
          FENNEK_VM_WIZARD: ${{ inputs.wizard && '1' || '' }}
        run: |
          sudo podman pull -q "$IMAGE"
          bash tests/vm-test.sh "$IMAGE" "$PWD/vm-out" "$EDITION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: vm
          path: vm-out/
          retention-days: 7
