name: iso

# Builds the Fennek OS live/installer ISO from the published, signed image.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # weekly, Monday after the daily image build

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Image + live layer + ISO need ~40 GB: put container storage on the runner's big /mnt disk.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo mkdir -p /mnt/containers && sudo rm -rf /var/lib/containers && sudo ln -s /mnt/containers /var/lib/containers
          df -h / /mnt

      # Same rule as for the base: verify the signature, then use exactly the signed digest.
      - name: Verify Fennek image signature
        run: |
          out=$(cosign verify --key keys/fennek-cosign.pub ghcr.io/olexify/fennekos:latest)
          digest=$(jq -r '.[0].critical.image."docker-manifest-digest"' <<<"$out")
          [[ $digest == sha256:* ]]
          echo "FENNEK_IMAGE=ghcr.io/olexify/fennekos@$digest" >> "$GITHUB_ENV"

      - name: Build live/installer layer
        run: |
          sudo podman build --cap-add sys_admin --security-opt label=disable --squash \
            --build-arg "FENNEK_IMAGE=$FENNEK_IMAGE" -t localhost/fennek-iso:latest iso/

      - name: Build ISO
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4  # main, 2026-05-19
        with:
          image-ref: localhost/fennek-iso:latest
          iso-dest: ${{ github.workspace }}/output/fennek-os.iso

      - name: Checksum
        run: cd output && sha256sum fennek-os.iso | tee fennek-os.iso.sha256 && ls -lh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fennek-os-iso
          path: output/
          retention-days: 14
          compression-level: 0
