name: build-arm

# ARM64 build (ARM laptops; Macs in a VM, native Macs later). Same Containerfile and build.sh as x86-64, on
# Fedora's official Kinoite for arm64 (pinned by digest; Universal Blue's base is amd64-only). Published as
# ghcr.io/olexify/fennekos:latest-arm64, signed with the same key as the x86-64 image.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/olexify/fennekos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Tools and disk space
        run: |
          command -v podman >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman skopeo jq; }
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Pin the base image digest
        run: |
          base=quay.io/fedora-ostree-desktops/kinoite:44
          digest=$(skopeo inspect --override-arch arm64 "docker://$base" | jq -r .Digest)
          [[ $digest == sha256:* ]]
          echo "BASE_IMAGE=quay.io/fedora-ostree-desktops/kinoite@$digest" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          # Version from the milestones file (1.0.12) + immutable build id (date.commit): Trails in the Updates window.
          v=$(python3 tools/fennek-version.py)
          b="$(date -u +%Y.%m.%d).${GITHUB_SHA::7}"
          echo "Fennek OS $v (build $b)"
          sudo podman build --build-arg "BASE_IMAGE=$BASE_IMAGE" --build-arg "FENNEK_VERSION=$v" --build-arg "FENNEK_BUILD=$b"             -f Containerfile -t fennek:arm .

      - name: Test image
        run: sudo podman run --rm -v "$PWD/test.sh:/t.sh:ro,z" fennek:arm bash /t.sh

      # Content-based layers, as on x86-64 (build.yml): updates only download what changed.
      - name: Regroup layers (chunkah, signature-verified)
        run: |
          out=$(cosign verify quay.io/coreos/chunkah:v0.7.1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/coreos/chunkah/.github/workflows/ci.yml@refs/tags/v0.7.1')
          chunkah="quay.io/coreos/chunkah@$(jq -r '.[0].critical.image."docker-manifest-digest"' <<<"$out")"
          [[ $chunkah == *@sha256:* ]]
          cd chunk
          sudo podman build --skip-unused-stages=false --from fennek:arm \
            -v "$PWD:/run/src" --security-opt=label=disable \
            --build-arg "CHUNKAH=$chunkah" \
            --build-arg "CHUNKAH_CONFIG_STR=$(sudo podman inspect fennek:arm)" \
            --build-arg "CHUNKAH_ARGS=--prune /sysroot/ --max-layers 128 --label ostree.commit- --label ostree.final-diffid-" \
            -f Containerfile -t fennek:arm-chunked .
          sudo podman image inspect fennek:arm-chunked --format '{{len .RootFS.Layers}} layers'

      - name: Test regrouped image
        run: |
          sudo podman run --rm fennek:arm-chunked bootc container lint
          sudo podman run --rm -v "$PWD/test.sh:/t.sh:ro,z" fennek:arm-chunked bash /t.sh

      - name: Publish and sign
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          day=$(date -u +%Y%m%d)
          for tag in latest-arm64 "$day-arm64"; do
            sudo podman push --digestfile "/tmp/digest-$tag" fennek:arm-chunked "$IMAGE:$tag"
            # Classic signature format, readable by installed systems (see build.yml).
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false \
              "$IMAGE@$(cat "/tmp/digest-$tag")"
          done
          cosign verify --key keys/fennek-cosign.pub "$IMAGE:latest-arm64" > /dev/null
          echo "Published $IMAGE:latest-arm64 and :$day-arm64 ($(cat /tmp/digest-latest-arm64)), signed and verified."
